name: Refresh HDB data

# data.gov.sg updates the resale dataset about monthly. Run twice a month and on demand.
on:
  schedule:
    - cron: "17 3 5 * *"
    - cron: "17 3 20 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build data file from data.gov.sg
        run: node scripts/build-data.mjs
      - name: Build crawlable pages and sitemap
        run: node scripts/build-pages.mjs
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain data/ prices.html sitemap.xml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/hdb-recent.json prices.html sitemap.xml
            git commit -m "Refresh HDB resale data"
            git push
          else
            echo "No change."
          fi
